    <script>
      (function() {
        try {
          var mode = localStorage.getItem('lifeos_appearance_mode') || 'light';
          var effective = mode;
          if (mode === 'system') {
            effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', effective);
          if (effective === 'light') {
            document.documentElement.classList.add('theme-light');
            document.documentElement.classList.remove('theme-dim', 'theme-dark', 'dark');
          } else if (effective === 'dim') {
            document.documentElement.classList.add('theme-dim', 'dark');
            document.documentElement.classList.remove('theme-light', 'theme-dark');
          } else {
            document.documentElement.classList.add('theme-dark', 'dark');
            document.documentElement.classList.remove('theme-light', 'theme-dim');
          }
        } catch(e) {}
      })();
    </script>
