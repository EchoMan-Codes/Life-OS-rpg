name: Build Jeevan Mobile App (Android APK & AAB)

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:5000/api/v1' }}

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon

      - name: Build Android Release AAB
        run: |
          cd client/android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jeevan-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: jeevan-release-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
