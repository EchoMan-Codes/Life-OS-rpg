name: Build Jeevan Mobile App (Android APK & AAB)

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Make Gradlew Executable
        run: chmod +x client/android/gradlew

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://lifeos-api-08o8.onrender.com/api/v1' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://lifeos-api-08o8.onrender.com/api/v1' }}

      - name: Sync Web Assets to Android
        run: |
          mkdir -p client/android/app/src/main/assets/public
          cp -r client/dist/* client/android/app/src/main/assets/public/
          cp client/capacitor.config.json client/android/app/src/main/assets/capacitor.config.json
          cd client
          npx cap sync android --verbose || true

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release AAB
        run: |
          cd client/android
          ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeevan-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeevan-release-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "Jeevan Mobile App (Android APK)"
          body: |
            ## 📱 Jeevan Native Mobile APK (Capacitor Android)
            Automated production build of the **Jeevan RPG Life-OS** mobile application.
            
            ### 📥 Download & Install
            1. Download the attached **`app-debug.apk`** directly to your Android device.
            2. Open the file to install (allow "Install from Unknown Sources" if prompted).
            3. Launch **Jeevan**!
          draft: false
          prerelease: false
          files: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
            client/android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
